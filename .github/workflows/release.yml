name: release

on:
  push:
    branches: [main]

jobs:
  code:
    uses: repobuddy/.github/.github/workflows/pnpm-verify.yml@v2
    with:
      os: '["ubuntu-latest"]'
      codecov-flags: unit

  publish-gate:
    uses: repobuddy/.github/.github/workflows/pnpm-publish-gate.yml@v2
    permissions:
      contents: read

  release:
    uses: repobuddy/.github/.github/workflows/pnpm-release-changeset-oidc.yml@v2
    needs: [code, publish-gate]
    # Declaring `permissions:` drops every unlisted scope to `none`, and the
    # callee cannot ask for more than this job grants.
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      actions: write # approves the Version Packages PR's parked runs
